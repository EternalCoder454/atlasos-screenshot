name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']
  workflow_dispatch:

# Nothing here writes to the repository or needs a token.
permissions:
  contents: read

concurrency:
  # One group per commit on main, so no run there is dropped while pending.
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Actions and atlas-framework are pinned by commit (the tag in the comment):
  # a moved tag can't change what runs here.

  # The Rust CLI: no toolkit, so no framework RPMs needed.
  check:
    name: fmt, clippy, tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: registry.fedoraproject.org/fedora:44
    steps:
      - name: Tools
        run: dnf -y install git-core cargo rust clippy rustfmt gcc pkgconf-pkg-config libxkbcommon-devel
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          # Only the downloads: an old target dir would grow without bound.
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-f44-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-f44-
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --locked

  # Telamon.Ui (telamon-ui), which the editor builds against, is in no
  # repository: build atlas-framework's RPMs, at the release the editor is
  # developed against, for the job below. Cached per pinned commit and month
  # (a Fedora Qt update gets fresh ones within a month), outside the checkout,
  # which actions/checkout would empty. The checksums catch a damaged entry.
  framework:
    name: atlas-framework RPMs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: registry.fedoraproject.org/fedora:44
    steps:
      - name: Tools for checkout and cache
        run: dnf -y install git-core tar zstd diffutils gawk
      - id: month
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /atlas-framework-rpms
          key: atlas-framework-rpms-f44-8e6a53569363aec3d7e42920875d03ca113ef3eb-${{ steps.month.outputs.month }}
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          repository: EternalCoder454/atlas-framework
          ref: 8e6a53569363aec3d7e42920875d03ca113ef3eb # v2.0.0
      - name: Build the RPMs
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          packaging/build-rpm.sh /atlas-framework-rpms
          cd /atlas-framework-rpms && sha256sum -- *.rpm > SHA256SUMS
      - name: Check the cached RPMs
        if: steps.cache.outputs.cache-hit == 'true'
        run: |
          cd /atlas-framework-rpms
          sha256sum --strict -c SHA256SUMS
          # Nothing unlisted is uploaded either.
          diff <(ls -1 -- *.rpm) <(awk '{print $2}' SHA256SUMS | sort)
        shell: bash
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: atlas-framework-rpms
          path: /atlas-framework-rpms/*.rpm
          if-no-files-found: error

  # The package: the CLI and the editor are built, the spec's %check runs
  # (the CLI's tests, the editor's ctest, the hardening and desktop-file
  # checks), and the RPMs that come out are looked at again.
  rpm:
    name: RPM
    needs: framework
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container: registry.fedoraproject.org/fedora:44
    steps:
      - name: Tools for checkout
        run: dnf -y install git-core tar
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: atlas-framework-rpms
          # In the container: runner.temp would be the host's path.
          path: /tmp/atlas-framework-rpms
      - name: Build the RPM
        run: TELAMON_LOCAL_RPMS=/tmp/atlas-framework-rpms packaging/build-rpm.sh "$GITHUB_WORKSPACE/out"
      # %check looked at the build root; this looks at the packages that are
      # uploaded: hardening of both programs, and no setuid, setgid or
      # world-writable file.
      - name: Check the packages' hardening and modes
        run: |
          dnf -y install binutils cpio
          mkdir /tmp/rpm-root
          for rpm in out/*.rpm; do rpm2cpio "$rpm" | (cd /tmp/rpm-root && cpio -idm --quiet); done
          scripts/check-hardening.sh --rust /tmp/rpm-root/usr/bin/telamon-screenshot
          scripts/check-hardening.sh /tmp/rpm-root/usr/bin/telamon-screenshot-editor
          # Symbolic links are always rwxrwxrwx: they are not files that can be written.
          if find /tmp/rpm-root -type f \( -perm /6000 -o -perm -0002 \) -print | grep .; then
            echo "the package holds a setuid, setgid or world-writable file" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: telamon-screenshot-rpms
          path: out/*.rpm
          if-no-files-found: error
