[package]
name = "telamon-screenshot"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
description = "Region screenshots to the Wayland clipboard: image, OCR text or redacted image"
license = "MIT"
repository = "https://github.com/EternalCoder454/atlasos-screenshot"
publish = false

[features]
default = ["ocr"]
# Ctrl+drag (text) and Alt+drag (redact). Without it, both modes report that
# OCR isn't built in.
ocr = ["dep:ocrs", "dep:rten", "dep:ureq", "dep:ring"]

[dependencies]
# Wayland: capture backends and the selection overlay
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
smithay-client-toolkit = { version = "0.20", default-features = false, features = ["xkbcommon"] }
# KWin's ScreenShot2 over D-Bus
zbus = { version = "5.19", default-features = false, features = ["blocking-api", "async-io"] }
rustix = { version = "1.1", features = ["fs", "pipe", "event", "process"] }
# fork/setsid for the clipboard server that outlives the CLI
libc = "0.2"
memmap2 = "0.9.11"
# Clipboard (ext-data-control on KWin, wlr-data-control on wlroots)
wl-clipboard-rs = "0.9.4"
# Image buffers and PNG encoding only
image = { version = "0.25.10", default-features = false, features = ["png"] }
# OCR, pure Rust. The models are downloaded on first use (src/models.rs).
ocrs = { version = "0.13.1", optional = true, default-features = false, features = ["rten"] }
# First-use model download: HTTPS only, rustls + bundled roots; ring is
# already in the tree through rustls and gives us SHA-256.
ureq = { version = "3.4.2", optional = true, default-features = false, features = ["rustls"] }
ring = { version = "0.17.14", optional = true }
rten = { version = "0.26.0", optional = true, default-features = false, features = ["rten_format"] }
regex = "1.13"
serde = { version = "1.0.229", features = ["derive"] }
toml = { version = "1.1", default-features = false, features = ["parse", "serde"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# OCR is unusably slow without optimisation, even in debug builds.
[profile.dev.package."*"]
opt-level = 2
